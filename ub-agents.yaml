# Project-owned starter. Customize models, checks, instructions, and merge authority.
repository: "arcadary/service"
shared-instructions: .agents/ub_agents.md
queue:
  milestones: ignore
  dependencies: wait
  priority:
    labels:
    - prio:urgent
    - prio:high
    - prio:medium
    - prio:low

# Let these bots' comments and reviews reach agents as feedback, with no other authority.
# https://agents.uberblick.ai/docs/configuration/approvals.html
# trusted-bots: [copilot-pull-request-reviewer, Copilot]

# Dependabot PRs need no maintainer start or head approval, and their bodies
# (upstream release notes) never reach agents: the title and the diff are the
# whole stated intent. The integrator merges them under the Dependabot rules in
# .agents/ub_agents.md.
trusted-pr-authors: [dependabot]

# Set up each new private worktree with the pinned Ruby (except fork PRs).
# In the control checkout, rerun when dependencies, tools or setup change.
checkout-setup:
  command:
    - sh
    - -ec
    - |
      mise trust ./mise.toml
      mise install
      export MISE_ACTIVATE_AGGRESSIVE=1 MISE_EXEC_AUTO_INSTALL=0
      mise exec -- ruby -e '
        expected = File.read(".ruby-version").strip.delete_prefix("ruby-")
        puts RUBY_DESCRIPTION
        abort "Expected Ruby #{expected}, got #{RUBY_VERSION}" unless RUBY_VERSION == expected
      '
      exec mise exec -- ruby bin/setup --skip-server
  when-changed: [Gemfile.lock, Gemfile, mise.toml, .ruby-version, bin/setup]
  timeout-seconds: 900

# Default arguments for each CLI.
# Grants full access without the Codex sandbox: https://agents.uberblick.ai/docs/configuration/permissions.html
# Grants unattended edits and git/gh/report commands: https://agents.uberblick.ai/docs/configuration/permissions.html
# Claude may also run mise, the bin/ scripts (bin/ci, bin/rails, bin/rubocop and the
# others) and read-only filters, so it can run the project's checks.
runtime-args:
  # Define the full transport for unattended worktrees even when project MCP config is skipped.
  # Use the worker account's existing hub login. The preparer checks decision evidence when needed.
  codex:
    - --sandbox
    - danger-full-access
    - -c
    - 'mcp_servers.uberblick.command="ub"'
    - -c
    - 'mcp_servers.uberblick.args=["mcp", "serve"]'
    - -c
    - 'mcp_servers.uberblick.env={ UB_HUB_URL = "https://hub.arcadary.org", UB_WORKSPACE_ID = "9370ef20-86bf-4dcd-b2a8-cca78f281ddb" }'
    - -c
    - 'mcp_servers.uberblick.enabled_tools=["search", "get_doc", "find_decisions"]'
    - -c
    - 'mcp_servers.uberblick.default_tools_approval_mode="approve"'
    - -c
    - mcp_servers.uberblick.required=false
  claude: ["--permission-mode", "acceptEdits", "--permission-prompts", "none", "--allowedTools", "Bash(git *)", "Bash(gh *)", "Bash(mise *)", "Bash(bin/*)", "Bash(grep *)", "Bash(head *)", "Bash(tail *)", "Bash(wc *)", "Bash(sort *)", "Bash(uniq *)", "Bash(cut *)", "Bash(diff *)", "Bash(jq *)", "Bash(ls *)", "Bash(cat *)", "Bash({report_command} report *)", "Bash({report_command} read *)", "Bash({report_command} retrospective *)", "mcp__uberblick__search", "mcp__uberblick__get_doc", "mcp__uberblick__find_decisions", "--add-dir", "{scratch}"]
# An agent's runtime-args list or mapping replaces these defaults entirely.
# Omit the agent key to inherit; an empty list or mapping disables the defaults.

# Update both agent CLIs and gh once a day between runs, each with its own updater.
runtime-updates:
  codex: auto
  claude: auto
  gh: auto
  ub: auto

# Customize these outcomes and rules with the project's owners.
agents:
  issue-preparer:
    runtime: "codex:gpt-6.1-sol:high"
    kind: issue
    trigger: needs-preparation
    outcomes:
      prepared: {add: [ready]}
      review: {add: [needs-review], max-rounds: 1}
      split: {}
      needs-human: {add: [needs-human]}
    instructions: .agents/issue-preparer.md
    retrospectives: 7
    worktree: true
    agent-timeout-minutes: 60

  issue-reviewer:
    runtime: "claude:claude-opus-5-5:high"
    kind: issue
    trigger: needs-review
    outcomes:
      approved: {add: [ready]}
      changes-requested: {add: [needs-preparation]}
      needs-human: {add: [needs-human]}
    instructions: .agents/issue-reviewer.md
    retrospectives: 8
    worktree: true
    agent-timeout-minutes: 60
    different-runtime-from: issue-preparer

  implementer:
    runtime: "codex:gpt-6.1-sol:high"
    trigger: [ready, needs-changes]
    outcomes:
      handed-off: {add: [needs-review]}
      needs-human: {add: [needs-human]}
    instructions: .agents/implementer.md
    retrospectives: 9
    worktree: true
    agent-timeout-minutes: 180

  reviewer:
    runtime: "claude:claude-opus-5-5:high"
    kind: pr
    trigger: needs-review
    outcomes:
      approved: {add: [ready-to-merge]}
      changes-requested: {add: [needs-changes], max-rounds: 3}
    instructions: .agents/reviewer.md
    retrospectives: 10
    worktree: true
    agent-timeout-minutes: 180
    different-runtime-from: implementer
    # Native GitHub approval requires an identity other than the PR author.

  integrator:
    runtime: "codex:gpt-6.1-sol:high"
    kind: pr
    # Dependabot labels its PRs `dependencies`, which sends them straight here.
    trigger: [ready-to-merge, dependencies]
    outcomes:
      # The launcher waits for every CI check at the reported head, then squash-merges.
      merged: {merge: squash}
      maintainer-merge: {add: [needs-human]}
      changes-requested: {add: [needs-changes]}
    # A PR GitHub reports as conflicting goes straight back to the implementer.
    on-conflict: changes-requested
    instructions: .agents/integrator.md
    retrospectives: 11
    worktree: true
    agent-timeout-minutes: 180

limits:
  agent-timeout-minutes: 180
  max-attempts: 5
  retry-backoff-seconds: 60
  max-backoff-seconds: 3600

poll-seconds: 30
stop-labels: [needs-human]

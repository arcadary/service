test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

<% if %w[R2_BUCKET R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY].all? { |name| ENV[name].present? } %>
r2:
  service: S3
  region: auto
  bucket: <%= ENV.fetch("R2_BUCKET").to_json %>
  endpoint: <%= ENV.fetch("R2_ENDPOINT").to_json %>
  access_key_id: <%= ENV.fetch("R2_ACCESS_KEY_ID").to_json %>
  secret_access_key: <%= ENV.fetch("R2_SECRET_ACCESS_KEY").to_json %>
  public: false
<% end %>

# Name of your application. Used to uniquely configure containers.
service: arcadary_service

# Name of the container image (use your-user/app-name on external registries).
image: arcadary_service

# The host the infrastructure repository creates. Its address comes from fnox, because this repository is public.
servers:
  web:
    - <%= ENV.fetch("DEPLOY_HOST") %>
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# Cloudflare terminates TLS and reaches kamal-proxy only through the cloudflared tunnel below, in plain HTTP on
# Docker's kamal network. The host's firewall has no web ports open, and the origin holds no certificate.
# kamal-proxy runs without a log: its request log records X-Forwarded-For, which Cloudflare always fills with the
# visitor's IP, next to each path and so each checksum. forward_headers is off because the app has no use for them.
proxy:
  ssl: false
  forward_headers: false
  host: api.arcadary.org
  response_timeout: 300
  buffering:
    requests: true
    responses: true
    max_request_body: 134217728
    max_response_body: 0
    memory: 1048576
  run:
    publish: false
    log_max_size: ""
    options:
      log-driver: none

# Where you keep your container images.
registry:
  # Alternatives: hub.docker.com / registry.digitalocean.com / ghcr.io / ...
  server: localhost:5555

  # Needed for authenticated registries.
  # username: your-user

  # Always use an access token rather than real password when possible.
  # password:
  #   - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - SECRET_KEY_BASE
    - VALIDATION_REVIEWER_USERNAME
    - VALIDATION_REVIEWER_PASSWORD
<% %w[R2_BUCKET R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY SCREENSHOT_CAPTURE_TOKEN].select { |name| ENV[name].present? }.each do |name| %>
    - <%= name %>
<% end %>
  clear:
    SCREENSHOT_PUBLIC_BASE_URL: <%= ENV.fetch("SCREENSHOT_PUBLIC_BASE_URL", "").to_json %>
    # Enable only after the maintainer completes the upload deployment checks in README.md.
    # VALIDATION_UPLOADS_ENABLED: "true"
    # VALIDATION_STORAGE_PATH: /rails/storage/validations
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Match this to any external database server to configure Active Record correctly
    # Use arcadary_service-db for a db accessory server on same machine via local kamal docker network.
    # DB_HOST: 192.168.0.2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# The SQLite databases live on the Hetzner Volume the infrastructure repository attaches, mounted on the
# host at /mnt/storage. Without the mount the container cannot start, so it never writes to the server's own disk.
volumes:
  - "/mnt/storage/arcadary_service:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-3.4.8
  # secrets:
  #   - GITHUB_TOKEN

# Use a different ssh user than root
# ssh:
#   user: app

# The Cloudflare Tunnel the infrastructure repository creates: cloudflared dials out to Cloudflare and hands each
# request to kamal-proxy. Its ingress rules live in Cloudflare; the token comes from fnox.
accessories:
  cloudflared:
    image: cloudflare/cloudflared:2026.11.2
    roles:
      - web
    cmd: tunnel run
    env:
      secret:
        - TUNNEL_TOKEN

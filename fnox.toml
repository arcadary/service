# Deploy secrets, encrypted with age. Only the encrypted values are stored here;
# the private key stays on the owner's machine and is never committed.
default_provider = "age"

[providers.age]
type = "age"
recipients = ["age1zhpafp0pfjev6cs3544hxj28rm3t86ca8k0agc5gpjunalfp7dqsyxmqyg"]
key_file = "~/.config/fnox/age.txt"

[secrets]
DEPLOY_HOST= { provider = "age", value = "" }
SECRET_KEY_BASE= { provider = "age", value = "" }
TUNNEL_TOKEN= { provider = "age", value = "" }
VALIDATION_REVIEWER_USERNAME= { provider = "age", value = "" }
VALIDATION_REVIEWER_PASSWORD= { provider = "age", value = "" }
ARCADARY_CATALOG_AUTHORIZATION= { provider = "age", value = "" }
R2_BUCKET= { provider = "age", value = "" }
R2_PUBLIC_BUCKET= { provider = "age", value = "" }
R2_ENDPOINT= { provider = "age", value = "" }
R2_ACCESS_KEY_ID= { provider = "age", value = "" }
R2_SECRET_ACCESS_KEY= { provider = "age", value = "" }

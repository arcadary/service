---
openapi: 3.0.1
info:
  title: Arcadary service API
  version: v1
  description: |-
    Public, anonymous reads for the Arcadary launcher; authenticated capture-device uploads and private admin staging. JSON routes end in .json; screenshot delivery ends in .png. Generated from the request specs in spec/requests; do not edit swagger/ by hand.

    Catalog data originates from [No-Intro](https://no-intro.org/), sourced through [libretro-database at f89f09cbe13f9f7863ecf20d0ebf2c5ce53be029](https://github.com/libretro/libretro-database/tree/f89f09cbe13f9f7863ecf20d0ebf2c5ce53be029/metadat/no-intro). Arcadary imports checksum metadata, groups releases into games, normalizes titles/regions/revisions and applies explicit launcher identity mappings. The entire service catalog, including project corrections, additions and later metadata fields, is licensed under [CC-BY-SA-4.0](https://creativecommons.org/licenses/by-sa/4.0/), as is the [upstream source at the pin](https://github.com/libretro/libretro-database/blob/f89f09cbe13f9f7863ecf20d0ebf2c5ce53be029/LICENSE). Screenshot images and all video are excluded: each medium's own rights apply. Catalog and screenshot licences grant no video rights. The owner-approved exception permits authenticated private HLS staging and delivery, including the private Donkey Kong trial, without public commercial-footage distribution or anonymous playthrough metadata. Internal HLS validation leaves all bytes private; expiry and bounded private reclamation retain terminal receipts; publication and delivery arrive separately. Application code remains MIT.

    The pinned NES DAT includes distinct headered .nes and unheadered .unh releases. A launcher hashing NES payload bytes without the iNES header sends the matching unheadered checksum. All eight lists are covered, including C64 tape metadata; catalog coverage does not imply launcher playback support. No game files or player filenames are received, stored or served.

    Optional release.controller_profile supplies version 1 original SNES face-button positions/labels and literal gameplay prompt letters for that exact stable release only. Each shared-media candidate retains its own facts; missing profiles are omitted, without defaults, candidate selection or edition inference. Public profiles exclude binding and evidence. Internal create_release/correct_release authoring accepts a whole profile or null to clear, under the revision/retry/audit contract; combined media edits require complete preview. The authored schema additionally requires binding matching system/region/revision (nullable edition strings, at most 128 characters) and 1–8 nonblank text citations per fact, each at most 500 characters. No images, clips, manual scans, file bytes, file names or game-file download locations in evidence. See README's Original controller layout and prompts and Catalog authoring sections for the internal contract. Profile corrections refresh release/media ETags and Last-Modified with existing cache lifetimes; reads remain anonymous and caller-independent. Controller classification, physical label/symbol mapping and local preferences belong to the launcher. No device/controller identity or choice is received. No real Zelda profile is populated; owner confirmation of exact identity, edition and textual evidence gates trial use only, not merge or issue closure. Publication and deployment remain outside scope.

    Release screenshots are ordered title then gameplay, empty when absent. Embedded game.screenshot is the picture from the lexicographically smallest stable release.id among that game's releases with screenshots, choosing gameplay then title, or null. This ordering does not recommend a release for playback. Each image exposes exactly kind, url, width, height and licence; licence is an empty string when no image licence is granted. Uploading grants no new rights. URLs use SCREENSHOT_PUBLIC_BASE_URL plus /v1/screenshots/{sha256}.png, with SHA-256 measured from the stored PNG, without signed/expiring parameters. Screenshot changes invalidate release and media validators, including sibling releases when the selected game picture changes.

    Image credits keyed by game.id: ucity — µCity graphics by AntonioND/SkyLyrac (Antonio Niño Díaz), [CC-BY-SA-4.0](https://creativecommons.org/licenses/by-sa/4.0/), [upstream v1.3 notice](https://github.com/AntonioND/ucity/blob/v1.3/readme.rst#license). tobu-tobu-girl — Tobu Tobu Girl assets by Tangram Games, [CC-BY-4.0](https://creativecommons.org/licenses/by/4.0/), [upstream notice](https://github.com/SimonLarsen/tobutobugirl/blob/048a22c2d7ebbe25811322e8692803fa86bb643a/README.md#license). Arcadary re-encodes captures as pixel-only PNGs, removing metadata. Launchers can attribute using game.id and the image's public licence value together with these credits.

    Image URLs identify releases; the service and CDN see callers' IP addresses. Reads are anonymous, not private. Uploads and authentication responses are never shared-cacheable. Takedown requests: takedown@arcadary.org. Origin removal cannot erase cached copies. Before public launch the deployment owner must verify CDN purging, delivery-layer access-log suppression, and that the alias accepts mail and forwards to a monitored inbox.
paths:
  "/v1/lookup/{sha1}.json":
    get:
      summary: Find what a game file is, by its SHA-1
      description: Anonymous lookup. A checksum in one release answers 301 to /v1/releases/{sha1}.json;
        a file shared by several releases redirects to /v1/media/{sha1}.json. Redirects
        are public for a day. The service never infers a set from one checksum or
        from file names. Unknown and malformed checksums are never stored.
      parameters:
      - name: sha1
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{40}$"
      responses:
        '301':
          description: known checksum
          headers:
            Location:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                enum:
                - max-age=86400, public
        '400':
          description: malformed SHA-1
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_sha1
        '404':
          description: unknown SHA-1
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
  "/mcp":
    post:
      summary: Authenticated stateless MCP Streamable HTTP
      security:
      - private_service_basic: []
      description: |
        Catalog reads, staged screenshot publication, private HLS intake and append-only device compatibility results (record_compatibility_result, get_compatibility) over MCP 1.11.0. See https://github.com/arcadary/service/blob/main/docs/mcp.md for discoverable input/output schemas, targeting, expiry, retries, pagination and client setup. Every method and subtree requires current shared admin Basic credentials before parsing and returns no-store. No OAuth discovery/login, SSE subscriptions or persistent sessions.

        Complete HTTP request bodies are bounded at 2 MiB (2097152 bytes) regardless of Content-Length; an oversized request returns HTTP 413. JSON nesting remains limited to 64. begin_playthrough_staging arguments follow the playthrough_declaration schema: stable release public_id, exact source_sha1, capture provenance, retry_key, immutable manifest and explicit authenticated mismatch-verification evidence when needed. Limits apply together: 1 MiB (1048576 bytes) UTF-8 compact argument JSON before normalization, excluding the JSON-RPC envelope; 4096 objects; 8 MiB (8388608 bytes) each; 4 GiB (4294967296 bytes) total. A 4096-object, 4 GiB declaration with short paths fits. Over-limit declarations return MCP tool error stage_too_large without a stage or authorization.

        Begin returns staging_id, release_id, package_sha256, state, every object's {object_id, path, received}, declared_at, stage_expires_at, capability and expires_at, within 1 MiB of structured JSON before SDK text representation. No declaration echo, bulk bytes, credentials or signed upload URLs. Identical normalized replay before declared_at plus 24 hours retains stage/package/progress/deadline and issues a fresh capability. At that deadline it returns stage_expired without authorization; changed input returns stage_conflict even after manifest pruning, with retry keys reserved. The capability lifetime stays exactly 900 seconds even beyond the stage deadline. Capabilities bind that exact release, stage, immutable manifest and declared objects and expire exactly 900 seconds after issuance, invalid at or after expires_at. Earlier tokens retain their expiry. Raw object PUT requires current Basic credentials plus X-Arcadary-Upload-Capability, never a URL token. Missing, expired or mismatched tokens return 403 upload_not_authorized before application transfer reads or storage access, including accepted-object retries. Authenticated metadata GET remains 200 with expired/reclaimed receipts, original declaration/deadline, fingerprint and provenance; reclaimed receipts omit object lists and manifests. Per-attempt renewable fenced leases protect concurrent work and hourly bounded cleanup retains key tombstones for late-write recovery. Metadata GET never mints or renews authorization; standalone HTTP stage POST is removed. No staged-byte playback/download route or public exposure. PNG bytes retain their separate authenticated HTTP staging route. No footage publication, provisioning or deployment is performed.
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: JSON-RPC result or protocol error
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - jsonrpc
                - id
                properties:
                  jsonrpc:
                    type: string
                    enum:
                    - '2.0'
                  id:
                    type: integer
                    nullable: true
                  result:
                    type: object
                  error:
                    type: object
        '401':
          description: missing or invalid credentials
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
            WWW-Authenticate:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
        '503':
          description: configured credentials absent or blank
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - authentication_unavailable
        '413':
          description: complete HTTP request exceeds 2 MiB
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - jsonrpc
                - error
                properties:
                  jsonrpc:
                    type: string
                    enum:
                    - '2.0'
                  id:
                    type: integer
                    nullable: true
                  error:
                    type: object
                    additionalProperties: false
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: integer
                        enum:
                        - -32600
                      message:
                        type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - jsonrpc
              - id
              - method
              properties:
                jsonrpc:
                  type: string
                  enum:
                  - '2.0'
                id:
                  type: integer
                method:
                  type: string
                params:
                  type: object
  "/v1/media/{sha1}.json":
    get:
      summary: Every release containing an exact file
      description: 'Lists releases in stable public-ID order, each in the release
        response shape with release.sha1 equal to the asked file. A checksum identifies
        membership only: the service never infers a set from one checksum or from
        file names. Successes are public for 300 seconds with ETag and Last-Modified
        validators; corrections refresh both, while cached responses may remain until
        their existing TTL expires. Last-Modified is the latest containing release
        timestamp. Current conditional requests return 304. Errors are never stored.'
      parameters:
      - name: sha1
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{40}$"
      responses:
        '200':
          description: containing releases
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - max-age=300, public
            ETag:
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - releases
                additionalProperties: false
                properties:
                  releases:
                    type: array
                    minItems: 1
                    items:
                      "$ref": "#/components/schemas/Release"
        '400':
          description: malformed SHA-1
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_sha1
        '404':
          description: unknown SHA-1
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
  "/v1/playthrough-stages/{staging_id}.json":
    get:
      summary: Read private declaration and durable object progress
      security:
      - private_service_basic: []
      parameters:
      - name: staging_id
        in: path
        required: true
        schema:
          type: string
      description: |
        declared_at is the original declaration/creation time; stage_expires_at is exactly 24 hours later. At that deadline every stage closes staging writes and internal validation rejects before replay. Unprotected stages expire on access; promoting/published retain their state without expired_at or reclaimed_at. GET remains 200: expired includes expired_at equal to the deadline; reclaimed adds reclaimed_at only after all associated reclaimable keys are confirmed absent with no deletion work pending. Receipts retain retry/stage identity, declaration fingerprint/package digest, exact release, source, capture and full mismatch evidence. Reclaimed receipts omit objects and manifests, including nested copies, and have no media attachments or bytes. Identical normalized begin replay returns stage_expired without authorization after the deadline; changed input returns stage_conflict even after pruning, with the retry key reserved.

        Transfers and validators have independent renewable fenced 15-minute leases. Concurrent different-object transfers proceed independently; same-object transfers return the winning receipt and delete only their own loser keys. Concurrent live validators replay the first terminal outcome, including conflicting local outcomes. Heartbeats renew during blocking upload/download and validation, without extending the declaration deadline. At lease equality abandoned attempts are fenced; stale attachment, validation commit/replay or renewal fails stage_conflict, or stage_expired after the deadline. Hourly cleanup at minute 5 after screenshot cleanup handles at most 100 stages and 500 keys with durable fair progress, skips live transfer/validation owners and uses renewable fenced claims. It deletes only owned private staging keys after reference rechecks; legacy bytes wait for the retained owning stage's original deadline. Failed deletion stays pending with retryable storage_unavailable while other work continues. Transfer key/blob identities and fencing tombstones persist with the stage, even after reclamation. Fenced late writers record pending work and delete only their own keys; failed deletion clears reclaimed_at until absence is reconfirmed. Cleanup revisits reclaimed tombstones even when a late writer crashes before recording pending work. Staging never reopens. All private HTTP, validation, cleanup and ownership failures suppress logs.

        Existing stages always return 200. incomplete means missing receipts; received means stored but unvalidated. validated, promoting and published include validation_result; promoting/published retain the exact validated payload, objects and declaration with only state changed, even after the deadline. They add no publication timestamp, claim data or terminal-expiry timestamps. validation_failed includes validation_error (invalid_hls or package_integrity_mismatch). Other states omit both validation fields. Results bind this exact staging ID, immutable normalized manifest/declaration fingerprint/package digest, stable release ID, source SHA-1 and capture/verification evidence. duration is exact summed decimal seconds, audio_codec is null for silent H.264, and absent chapters use chapters_path:null and chapters:[]. Before the deadline, promoting/published validation replays without storage reads, PUT retains identical receipts and MCP begin retains the same stage/objects/received summary with a fresh capability. No public object, descriptor, redirect or playback is created.

        Internal PlaythroughPromotionService.claim_promotion(staging_id:, release_id:, package_sha256:) verifies persisted validation/stage/stable-release/package bindings and atomically pins an unexpired validated stage as promoting. Identical active requests return the same durable opaque claim, even after the deadline; active claims never time out. complete_promotion(claim:) records published; release_promotion(claim:) restores validated before the original deadline or expired at/after it. Matching terminal outcomes replay after restart; crossed operations, wrong/stale claims, ineligible/published stages and changed bindings fail stage_conflict. Unknown stages raise not_found; expired/reclaimed stages reject claims with stage_expired. A fresh claim after release has a new identity; repeating the old release is a no-op. Promotion uses the same atomic exclusion as expiry, attachment, validation finalization and reclamation. Cleanup excludes promoting/published stages from selection and visit counts; published staging objects, blobs and complete manifests remain indefinitely, even after pointer replacement. The #57 publisher must complete inside its successful release-pointer transaction (completion rolls back with it), release only after copying stops, and own historical successful-publication retries. Storage stays outside transactions; claims and private failures are never logged or exposed. No copying, release pointer, validation/promotion HTTP route or MCP publication tool is added here.

        PlaythroughValidationService.validate(staging_id:) is an internal operation for the authenticated MCP workflow, without a validation HTTP route. Unknown IDs raise not_found. Before the declaration deadline, persisted success or terminal failure replays before completeness or storage checks, including after restart; concurrent live validation cannot overwrite it. stage_incomplete is retryable and precedes all byte reads/parsing, including malformed received playlists or wrong role MIME. All completed objects are then read and verified before HLS interpretation: missing/unreadable blobs raise retryable storage_unavailable; readable bytes or stored size/hash/MIME disagreement raises terminal package_integrity_mismatch. Wrong declared role MIME, undeclared references, malformed/unsupported HLS, transport or chapters raises terminal invalid_hls. Retryable failures leave state unchanged; terminal failures require a new declaration/retry key to correct bytes. PUT receipts and declaration replays stay immutable. Internal validation suppresses logs, including failures.

        Restricted RFC 8216 profile: UTF-8 NFC, no BOM/control characters, LF or CRLF, first-line EXTM3U, exactly one EXT-X-VERSION:3 in every playlist. One media playlist or one master directly referencing media playlists, with shared media references allowed; no nested masters, alternate renditions or other tags/attributes. Masters require positive unsigned 64-bit BANDWIDTH; optional positive AVERAGE-BANDWIDTH, quoted CODECS list and positive RESOLUTION dimensions use RFC syntax and unique attributes. Media requires segments, a single positive unsigned 64-bit TARGETDURATION, PLAYLIST-TYPE:VOD, terminal ENDLIST and optional single MEDIA-SEQUENCE:0 before segments. Every URI follows one positive finite decimal EXTINF and required comma; optional UTF-8 titles are ignored. Half-up rounded durations cannot exceed target. Variant segment counts and numeric duration sequences must match. References use declaration path grammar relative to their playlist; every declared object must be reachable except optional root chapters.vtt, which is also required and validated. MIME roles: application/vnd.apple.mpegurl, video/mp2t, text/vtt.

        Each MPEG-TS segment is nonempty, 188-byte framed with sync 0x47, valid packet/adaptation/PSI lengths, no transport errors/scrambling, and complete CRC-checked PAT then matching PMT before elementary payload. DVB service-information PIDs 0x0010–0x001F (including SDT on 0x0011) pass packet/adaptation checks, then their payloads are ignored; they may precede the PAT and do not count as elementary streams. CAT and undeclared elementary-stream PIDs remain rejected. One nonzero program, exactly one H.264 stream (0x1B), optionally one AAC/ADTS (0x0F), no other elementary streams, with payload for every declared stream. Audio presence must agree across the package. PMT determines codecs; full decoding is outside validation. chapters.vtt permits one initial UTF-8 BOM, exact WEBVTT then blank line, and 1–256 chronological non-overlapping cues within summed duration. Each cue is HH:MM:SS.mmm --> HH:MM:SS.mmm (two-digit hours, minutes/seconds 00–59), one nonblank title without <, & or -->, and blank separation. No header text, identifiers, settings, markup or STYLE/REGION/NOTE blocks.
      responses:
        '200':
          description: metadata only; no bytes or storage URLs
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - staging_id
                - release_id
                - package_sha256
                - declaration
                - state
                - declared_at
                - stage_expires_at
                properties:
                  staging_id:
                    type: string
                  release_id:
                    type: string
                  package_sha256:
                    type: string
                    pattern: "^[0-9a-f]{64}$"
                  declaration:
                    oneOf:
                    - "$ref": "#/components/schemas/playthrough_declaration"
                    - type: object
                      additionalProperties: false
                      required:
                      - retry_key
                      - release_id
                      - source_sha1
                      - capture
                      properties:
                        retry_key:
                          type: string
                          minLength: 1
                          maxLength: 200
                        release_id:
                          type: string
                          minLength: 1
                          maxLength: 200
                          description: Stable release public_id, never a title or
                            checksum selector.
                        source_sha1:
                          type: string
                          pattern: "^[0-9a-f]{40}$"
                          minLength: 40
                          maxLength: 40
                        capture:
                          type: object
                          additionalProperties: false
                          required:
                          - tool
                          - version
                          - captured_at
                          properties:
                            tool:
                              type: string
                              minLength: 1
                              maxLength: 200
                            version:
                              type: string
                              minLength: 1
                              maxLength: 200
                            captured_at:
                              type: string
                              format: date-time
                              maxLength: 64
                        verification:
                          type: object
                          additionalProperties: false
                          required:
                          - source_sha1
                          - payload_sha1
                          - relationship
                          - method
                          - result
                          - verifier
                          - verified_at
                          - evidence
                          properties:
                            source_sha1:
                              type: string
                              pattern: "^[0-9a-f]{40}$"
                              minLength: 40
                              maxLength: 40
                            payload_sha1:
                              type: string
                              pattern: "^[0-9a-f]{40}$"
                              minLength: 40
                              maxLength: 40
                            relationship:
                              type: string
                              enum:
                              - trailing_padding
                              - verified_equivalence
                            removed_bytes:
                              type: integer
                              minimum: 1
                            method:
                              type: string
                              minLength: 1
                              maxLength: 8000
                            result:
                              type: string
                              enum:
                              - success
                            verifier:
                              type: string
                              minLength: 1
                              maxLength: 8000
                            verified_at:
                              type: string
                              format: date-time
                              maxLength: 64
                            evidence:
                              type: string
                              minLength: 1
                              maxLength: 8000
                  state:
                    type: string
                    enum:
                    - incomplete
                    - received
                    - validated
                    - validation_failed
                    - promoting
                    - published
                    - expired
                    - reclaimed
                  declared_at:
                    type: string
                    format: date-time
                  stage_expires_at:
                    type: string
                    format: date-time
                  expired_at:
                    type: string
                    format: date-time
                  reclaimed_at:
                    type: string
                    format: date-time
                  declaration_sha256:
                    type: string
                    pattern: "^[0-9a-f]{64}$"
                  validation_result:
                    "$ref": "#/components/schemas/playthrough_validation_result"
                  validation_error:
                    type: string
                    enum:
                    - invalid_hls
                    - package_integrity_mismatch
                  objects:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - object_id
                      - path
                      - received
                      properties:
                        object_id:
                          type: string
                        path:
                          type: string
                        received:
                          type: boolean
        '404':
          description: unknown stage
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
        '401':
          description: authentication failed
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
        '503':
          description: authentication not configured
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - authentication_unavailable
  "/v1/playthrough-stages/{staging_id}/objects/{stage_object_id}.json":
    put:
      summary: Receive one declared private object
      security:
      - private_service_basic: []
      parameters:
      - name: staging_id
        in: path
        required: true
        schema:
          type: string
      - name: stage_object_id
        in: path
        required: true
        schema:
          type: string
      - name: X-Arcadary-Upload-Capability
        in: header
        required: true
        schema:
          type: string
      description: 'Requires current shared Basic credentials plus X-Arcadary-Upload-Capability
        from MCP begin_playthrough_staging. Capabilities bind the exact release, stage,
        immutable manifest and declared objects, never travel in URLs, and expire
        exactly 900 seconds after issuance (invalid at or after expires_at). Identical
        begin replay renews before the 24-hour declaration deadline without extending
        older capabilities or the stage deadline; HTTP metadata reads never renew.
        After Basic authentication, missing, invalid, expired or mismatched capabilities
        and unknown object IDs return 403 upload_not_authorized first. Valid declared-object
        authorization on an expired/reclaimed stage returns 410 stage_expired, including
        accepted-object retries, before application body or storage reads. Capability
        expiry remains issuance plus 900 seconds even beyond the stage deadline. Raw
        bytes with the exact declared Content-Type; any valid declared MIME type without
        parameters is accepted. Exact size and SHA-256 must match, including on successful
        retries. Reads are bounded at 8 MiB regardless of Content-Length. Success
        returns an immutable object_id/received_at receipt; identical retries return
        exactly that receipt, even after other objects finish. GET stage metadata
        for aggregate progress. Fresh private storage keys isolate attempts and stages;
        completion follows storage success. Interrupted reads and storage failure
        leave the object incomplete and retryable after restart. No HLS validation
        or playback is performed. The deployment owner must verify the zone upload
        setting, which can be lower than Cloudflare''s documented 100 MB minimum plan
        limit: https://developers.cloudflare.com/cache/concepts/default-cache-behavior/#upload-limits
        (#57).'
      responses:
        '200':
          description: verified object received, or identical successful retry
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - object_id
                - received_at
                properties:
                  object_id:
                    type: string
                  received_at:
                    type: string
                    format: date-time
        '400':
          description: interrupted read
          headers:
            Cache-Control:

---
openapi: 3.0.1
info:
  title: Arcadary service API
  version: v1
  description: |-
    Public, anonymous reads for the Arcadary launcher, and authenticated admin uploads. JSON routes end in .json. Generated from the request specs in spec/requests; do not edit swagger/ by hand.

    Catalog data originates from [No-Intro](https://no-intro.org/), sourced through [libretro-database at f89f09cbe13f9f7863ecf20d0ebf2c5ce53be029](https://github.com/libretro/libretro-database/tree/f89f09cbe13f9f7863ecf20d0ebf2c5ce53be029/metadat/no-intro). Arcadary imports checksum metadata, groups releases into games, normalizes titles/regions/revisions and applies explicit launcher identity mappings. The entire service catalog, including project corrections, additions and later metadata fields, is licensed under [CC-BY-SA-4.0](https://creativecommons.org/licenses/by-sa/4.0/), as is the [upstream source at the pin](https://github.com/libretro/libretro-database/blob/f89f09cbe13f9f7863ecf20d0ebf2c5ce53be029/LICENSE). Screenshot images and all video are excluded: each medium's own rights apply. Catalog and screenshot licences grant no video rights. The owner-approved exception permits authenticated private HLS uploads, including the private Donkey Kong trial, without public commercial-footage distribution or anonymous playthrough metadata; uploaded playthroughs stay private. Application code remains MIT.

    The pinned NES DAT includes distinct headered .nes and unheadered .unh releases. A launcher hashing NES payload bytes without the iNES header sends the matching unheadered checksum. All eight lists are covered, including C64 tape metadata; catalog coverage does not imply launcher playback support. No game files or player filenames are received, stored or served.

    Optional release.controller_profile supplies version 1 original SNES face-button positions/labels and literal gameplay prompt letters for that exact stable release only. Each shared-media candidate retains its own facts; missing profiles are omitted, without defaults, candidate selection or edition inference. Public profiles exclude binding and evidence. Internal create_release/correct_release authoring accepts a whole profile or null to clear, under the revision/retry/audit contract; combined media edits require complete preview. The authored schema additionally requires binding matching system/region/revision (nullable edition strings, at most 128 characters) and 1–8 nonblank text citations per fact, each at most 500 characters. No images, clips, manual scans, file bytes, file names or game-file download locations in evidence. See README's Original controller layout and prompts and Catalog authoring sections for the internal contract. Profile corrections refresh release/media ETags and Last-Modified with existing cache lifetimes; reads remain anonymous and caller-independent. Controller classification, physical label/symbol mapping and local preferences belong to the launcher. No device/controller identity or choice is received. No real Zelda profile is populated; owner confirmation of exact identity, edition and textual evidence gates trial use only, not merge or issue closure. Publication and deployment remain outside scope.

    Release screenshots are ordered title then gameplay, empty when absent. Embedded game.screenshot is the picture from the lexicographically smallest stable release.id among that game's releases with screenshots, choosing gameplay then title, or null. This ordering does not recommend a release for playback. Each image exposes exactly kind, url, width, height and licence; licence is an empty string when no image licence is granted. Uploading grants no new rights. URLs are the public media host (https://media.arcadary.org in production) plus /screenshots/{sha256}.png, with SHA-256 measured from the stored PNG, without signed/expiring parameters. Screenshot changes invalidate release and media validators, including sibling releases when the selected game picture changes.

    Image credits keyed by game.id: ucity — µCity graphics by AntonioND/SkyLyrac (Antonio Niño Díaz), [CC-BY-SA-4.0](https://creativecommons.org/licenses/by-sa/4.0/), [upstream v1.3 notice](https://github.com/AntonioND/ucity/blob/v1.3/readme.rst#license). tobu-tobu-girl — Tobu Tobu Girl assets by Tangram Games, [CC-BY-4.0](https://creativecommons.org/licenses/by/4.0/), [upstream notice](https://github.com/SimonLarsen/tobutobugirl/blob/048a22c2d7ebbe25811322e8692803fa86bb643a/README.md#license). Arcadary re-encodes captures as pixel-only PNGs, removing metadata. Launchers can attribute using game.id and the image's public licence value together with these credits.

    Image URLs identify releases; the service and CDN see callers' IP addresses. Reads are anonymous, not private. Uploads and authentication responses are never shared-cacheable. Takedown requests: takedown@arcadary.org. Origin removal cannot erase cached copies. Before public launch the deployment owner must verify CDN purging, delivery-layer access-log suppression, and that the alias accepts mail and forwards to a monitored inbox.
paths:
  "/v1/lookup/{sha1}.json":
    get:
      summary: Find what a game file is, by its SHA-1
      description: Anonymous lookup. A checksum in one release answers 301 to /v1/releases/{sha1}.json;
        a file shared by several releases redirects to /v1/media/{sha1}.json. Redirects
        are public for a day. The service never infers a set from one checksum or
        from file names. Unknown and malformed checksums are never stored.
      parameters:
      - name: sha1
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{40}$"
      responses:
        '301':
          description: known checksum
          headers:
            Location:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                enum:
                - max-age=86400, public
        '400':
          description: malformed SHA-1
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_sha1
        '404':
          description: unknown SHA-1
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
  "/mcp":
    post:
      summary: Authenticated stateless MCP Streamable HTTP
      security:
      - private_service_basic: []
      description: |
        Catalog reads and uploads over MCP 1.11.0. See https://github.com/arcadary/service/blob/main/docs/mcp.md for discoverable input/output schemas, targeting, pagination and client setup. Every method and subtree requires current shared admin Basic credentials before parsing and returns no-store. No OAuth discovery/login, SSE subscriptions or persistent sessions.

        Complete HTTP request bodies are bounded at 2 MiB (2097152 bytes) regardless of Content-Length; an oversized request returns HTTP 413. JSON nesting remains limited to 64. request_upload returns an upload_id and the upload_url its files are PUT to; confirm_upload checks the upload as a whole; upload_screenshot and upload_video turn a confirmed upload into a release's screenshot or a private playthrough. File bytes never travel through MCP.
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: JSON-RPC result or protocol error
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - jsonrpc
                - id
                properties:
                  jsonrpc:
                    type: string
                    enum:
                    - '2.0'
                  id:
                    type: integer
                    nullable: true
                  result:
                    type: object
                  error:
                    type: object
        '401':
          description: missing or invalid credentials
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
            WWW-Authenticate:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
        '503':
          description: configured credentials absent or blank
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - authentication_unavailable
        '413':
          description: complete HTTP request exceeds 2 MiB
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - jsonrpc
                - error
                properties:
                  jsonrpc:
                    type: string
                    enum:
                    - '2.0'
                  id:
                    type: integer
                    nullable: true
                  error:
                    type: object
                    additionalProperties: false
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: integer
                        enum:
                        - -32600
                      message:
                        type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - jsonrpc
              - id
              - method
              properties:
                jsonrpc:
                  type: string
                  enum:
                  - '2.0'
                id:
                  type: integer
                method:
                  type: string
                params:
                  type: object
  "/v1/media/{sha1}.json":
    get:
      summary: Every release containing an exact file
      description: 'Lists releases in stable public-ID order, each in the release
        response shape with release.sha1 equal to the asked file. A checksum identifies
        membership only: the service never infers a set from one checksum or from
        file names. Successes are public for 300 seconds with ETag and Last-Modified
        validators; corrections refresh both, while cached responses may remain until
        their existing TTL expires. Last-Modified is the latest containing release
        timestamp. Current conditional requests return 304. Errors are never stored.'
      parameters:
      - name: sha1
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{40}$"
      responses:
        '200':
          description: containing releases
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - max-age=300, public
            ETag:
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - releases
                additionalProperties: false
                properties:
                  releases:
                    type: array
                    minItems: 1
                    items:
                      "$ref": "#/components/schemas/Release"
        '400':
          description: malformed SHA-1
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_sha1
        '404':
          description: unknown SHA-1
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
  "/v1/releases/{sha1}.json":
    get:
      summary: A release and its game, by the SHA-1 of its game file
      description: The target of an unambiguous lookup redirect. Hex is case-insensitive;
        release.sha1 is the asked file and release.id identifies the whole release.
        Media are in position order. Startup applies defaults and includes a SHA-256
        revision over effective startup and ordered checksums. C64 slots are 8 and
        9; other systems have no drives. The service never infers a set from one checksum
        or from file names. Successes are public for 300 seconds with ETag and Last-Modified
        validators; corrections refresh both, while cached responses may remain until
        their existing TTL expires. Current conditional requests return 304. Errors
        are never stored.
      parameters:
      - name: sha1
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{40}$"
          minLength: 40
          maxLength: 40
      responses:
        '200':
          description: release and game
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - max-age=300, public
            ETag:
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Release"
        '400':
          description: malformed SHA-1
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_sha1
        '404':
          description: unknown SHA-1
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - release_not_found
        '409':
          description: file belongs to several releases; use /v1/media/{sha1}.json
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - ambiguous_release
  "/v1/uploads/{upload_id}/files/{name}":
    put:
      summary: Store one file of an upload
      security:
      - private_service_basic: []
      description: 'Stores one file, exactly as sent, on the service host''s own disk
        until the upload is confirmed, used or expires 24 hours after request_upload.
        The upload_id comes from the MCP tool request_upload, whose limits apply;
        name is the file''s package-relative path. Send the file''s Content-Type and
        its SHA-256 in Content-Digest (sha-256=:BASE64:). Each file is checked on
        arrival: digest, size and file type. Sending the same name with the same digest
        again changes nothing.'
      parameters:
      - name: upload_id
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: Content-Digest
        in: header
        required: true
        schema:
          type: string
          pattern: "^sha-256=:[A-Za-z0-9+/]{43}=:$"
      responses:
        '200':
          description: file stored, or the same file sent again
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UploadFile"
        '400':
          description: interrupted read
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - interrupted_transfer
        '401':
          description: authentication failed
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
        '404':
          description: unknown upload
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
        '409':
          description: upload no longer takes files, or the name holds a different
            file
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - upload_conflict
        '410':
          description: the 24-hour lease ran out
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - upload_expired
        '413':
          description: a file or the upload exceeds its cap
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - upload_too_large
        '422':
          description: digest, size, name, type or file check failed
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - upload_rejected
        '503':
          description: storage unavailable
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - storage_unavailable
        '507':
          description: stored uploads already total 10 GB
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - uploads_full
      requestBody:
        content:
          image/png:
            schema:
              type: string
              format: binary
          application/vnd.apple.mpegurl:
            schema:
              type: string
              format: binary
          video/mp2t:
            schema:
              type: string
              format: binary
          text/vtt:
            schema:
              type: string
              format: binary
        required: true
  "/v1/uploads/{upload_id}.json":
    get:
      summary: An upload's state and files
      security:
      - private_service_basic: []
      description: 'Lists the files stored so far, so an interrupted upload resumes
        by sending the missing ones. States: requested, receiving, checking (confirm_upload
        is checking it in the background), confirmed, rejected (with rejection_reason)
        and used.'
      parameters:
      - name: upload_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: upload
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Upload"
        '404':
          description: unknown upload
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
components:
  securitySchemes:
    private_service_basic:
      type: http
      scheme: basic
  schemas:
    Screenshot:
      type: object
      required:
      - kind
      - url
      - width
      - height
      - licence
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - title
          - gameplay
        url:
          type: string
          format: uri
          pattern: "^https://"
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        licence:
          type: string
    Upload:
      type: object
      additionalProperties: false
      required:
      - upload_id
      - type
      - state
      - expires_at
      - rejection_reason
      - files
      properties:
        upload_id:
          type: string
        type:
          type: string
          enum:
          - screenshot
          - video
        state:
          type: string
          enum:
          - requested
          - receiving
          - checking
          - confirmed
          - rejected
          - used
        expires_at:
          type: string
          format: date-time
        rejection_reason:
          type:
          - string
          - 'null'
        files:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - size
            - sha256
            properties:
              name:
                type: string
              size:
                type: integer
                minimum: 1
              sha256:
                type: string
                pattern: "^[0-9a-f]{64}$"
    UploadFile:
      type: object
      additionalProperties: false
      required:
      - name
      - size
      - sha256
      properties:
        name:
          type: string
        size:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
    ControllerProfile:
      type: object
      required:
      - version
      - layout
      - prompts
      additionalProperties: false
      description: Optional exact-release original SNES layout and literal gameplay
        prompt letters. Positions face the controller buttons. No system defaults
        or edition inference. Binding and text citations remain internal. Controller
        classification, physical label/symbol mapping and preferences belong to the
        launcher. The Zelda trial is unconfirmed pending owner confirmation of the
        stable release ID, checksum, edition and textual evidence; no real trial profile
        is populated.
      properties:
        version:
          type: integer
          enum:
          - 1
        layout:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            required:
            - position
            - label
            additionalProperties: false
            properties:
              position:
                type: string
                enum:
                - top
                - right
                - bottom
                - left
              label:
                type: string
                enum:
                - X
                - A
                - B
                - "Y"
        prompts:
          type: array
          maxItems: 16
          items:
            type: object
            required:
            - letter
            - position
            additionalProperties: false
            properties:
              letter:
                type: string
                pattern: "^[A-Za-z]$"
                minLength: 1
                maxLength: 1
              position:
                type: string
                enum:
                - top
                - right
                - bottom
                - left
    Release:
      type: object
      required:
      - release
      - game
      - media
      - startup
      additionalProperties: false
      properties:
        release:
          type: object
          required:
          - id
          - sha1
          - system
          - region
          - revision
          - screenshots
          additionalProperties: false
          properties:
            id:
              type: string
            sha1:
              type: string
              pattern: "^[0-9a-f]{40}$"
            system:
              type: string
              enum:
              - nes
              - snes
              - gb
              - gbc
              - megadrive
              - pcengine
              - atari2600
              - c64
            region:
              type: string
              nullable: true
            revision:
              type: string
              nullable: true
            controller_profile:
              "$ref": "#/components/schemas/ControllerProfile"
            screenshots:
              type: array
              items:
                "$ref": "#/components/schemas/Screenshot"
        game:
          type: object
          required:
          - id
          - title
          - screenshot
          additionalProperties: false
          properties:
            id:
              type: string
            title:
              type: string
            screenshot:
              type: object
              required:
              - kind
              - url
              - width
              - height
              - licence
              additionalProperties: false
              properties:
                kind:
                  type: string
                  enum:
                  - title
                  - gameplay
                url:
                  type: string
                  format: uri
                  pattern: "^https://"
                width:
                  type: integer
                  minimum: 1
                height:
                  type: integer
                  minimum: 1
                licence:
                  type: string
              nullable: true
        media:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - key
            - position
            - label
            - role
            - sha1
            - size
            - format
            additionalProperties: false
            properties:
              key:
                type: string
                pattern: "^[a-z0-9-]{1,32}$"
              position:
                type: integer
                minimum: 1
              label:
                type: string
                nullable: true
                maxLength: 80
              role:
                type: string
                enum:
                - game
                - save
              sha1:
                type: string
                pattern: "^[0-9a-f]{40}$"
              size:
                type: integer
                minimum: 0
                nullable: true
              format:
                type: string
                pattern: "^[a-z0-9]+$"
                nullable: true
        startup:
          type: object
          required:
          - schema
          - boot
          - drives
          - revision
          additionalProperties: false
          properties:
            schema:
              type: integer
              enum:
              - 1
            boot:
              type: string
            drives:
              type: object
              additionalProperties: false
              properties:
                '8':
                  type: string
                '9':
                  type: string
            revision:
              type: string
              pattern: "^[0-9a-f]{64}$"
servers:
- url: "/"

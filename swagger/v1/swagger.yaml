---
openapi: 3.0.1
info:
  title: Arcadary service API
  version: v1
  description: |-
    Public, anonymous JSON API for the Arcadary launcher. Generated from the request specs in spec/requests; do not edit swagger/ by hand.

    Catalog data originates from [No-Intro](https://no-intro.org/), sourced through [libretro-database at f89f09cbe13f9f7863ecf20d0ebf2c5ce53be029](https://github.com/libretro/libretro-database/tree/f89f09cbe13f9f7863ecf20d0ebf2c5ce53be029/metadat/no-intro). Arcadary imports checksum metadata, groups releases into games, normalizes titles/regions/revisions and applies explicit launcher identity mappings. The entire service catalog, including project corrections, additions and later fields, is licensed under [CC-BY-SA-4.0](https://creativecommons.org/licenses/by-sa/4.0/), as is the [upstream source at the pin](https://github.com/libretro/libretro-database/blob/f89f09cbe13f9f7863ecf20d0ebf2c5ce53be029/LICENSE). Application code remains MIT.

    The pinned NES DAT includes distinct headered .nes and unheadered .unh releases. A launcher hashing NES payload bytes without the iNES header sends the matching unheadered checksum. All eight lists are covered, including C64 tape metadata; catalog coverage does not imply launcher playback support. Public reads receive no file bytes or player filenames. The opt-in validation write flow accepts unknown files into private storage and changes no catalog or verification status. No public file route exists.
paths:
  "/v1/lookup/{sha1}.json":
    get:
      summary: Find what a game file is, by its SHA-1
      description: Anonymous lookup. A checksum in one release answers 301 to /v1/releases/{sha1}.json;
        a file shared by several releases redirects to /v1/media/{sha1}.json. Redirects
        are public for a day. The service never infers a set from one checksum or
        from file names. Unknown and malformed checksums are never stored.
      parameters:
      - name: sha1
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{40}$"
      responses:
        '301':
          description: known checksum
          headers:
            Location:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                enum:
                - max-age=86400, public
        '400':
          description: malformed SHA-1
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_sha1
        '404':
          description: unknown SHA-1
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
  "/v1/media/{sha1}.json":
    get:
      summary: Every release containing an exact file
      description: 'Lists releases in stable public-ID order, each in the release
        response shape with release.sha1 equal to the asked file. A checksum identifies
        membership only: the service never infers a set from one checksum or from
        file names. Successes are public for 300 seconds with an ETag; errors are
        never stored.'
      parameters:
      - name: sha1
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{40}$"
      responses:
        '200':
          description: containing releases
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - max-age=300, public
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - releases
                additionalProperties: false
                properties:
                  releases:
                    type: array
                    minItems: 1
                    items:
                      "$ref": "#/components/schemas/Release"
        '400':
          description: malformed SHA-1
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_sha1
        '404':
          description: unknown SHA-1
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
  "/v1/releases/{sha1}.json":
    get:
      summary: A release and its game, by the SHA-1 of its game file
      description: The target of an unambiguous lookup redirect. Hex is case-insensitive;
        release.sha1 is the asked file and release.id identifies the whole release.
        Media are in position order. Startup applies defaults and includes a SHA-256
        revision over effective startup and ordered checksums. C64 slots are 8 and
        9; other systems have no drives. The service never infers a set from one checksum
        or from file names. Successes are public for 300 seconds with an ETag; errors
        are never stored.
      parameters:
      - name: sha1
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{40}$"
          minLength: 40
          maxLength: 40
      responses:
        '200':
          description: release and game
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - max-age=300, public
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Release"
        '400':
          description: malformed SHA-1
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_sha1
        '404':
          description: unknown SHA-1
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - release_not_found
        '409':
          description: file belongs to several releases; use /v1/media/{sha1}.json
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - ambiguous_release
  "/v1/validations.json":
    post:
      summary: Admit an unknown file for private validation
      description: Anonymous and cookie-free. JSON is at most 1,024 bytes and contains
        exactly sha1, byte_size and system. Availability precedes media/encoding,
        metadata size, structure/fields, file size, known-release and conflict checks.
        Absent or identity Content-Encoding only. The launcher checks its reference
        lists and unknown lookup and obtains player confirmation; the service cannot
        prove those checks. No filename is accepted.
      parameters:
      - name: Content-Encoding
        in: header
        required: false
        schema:
          type: string
          enum:
          - identity
      responses:
        '201':
          description: admitted, including a matching incomplete retry
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - admission
                - expires_at
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum:
                    - admitted
                  admission:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '200':
          description: already received; no further transfer
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationReceived"
        '400':
          description: invalid JSON object or metadata
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_metadata
        '409':
          description: known release or conflicting submission facts
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - known_release
                    - submission_conflict
        '413':
          description: metadata or file above its bound
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - metadata_too_large
                    - file_too_large
        '415':
          description: unsupported media type or content encoding
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - unsupported_media_type
        '503':
          description: receipt unavailable; no admission or submission change
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - unavailable
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - sha1
              - byte_size
              - system
              additionalProperties: false
              properties:
                sha1:
                  type: string
                  pattern: "^[0-9a-fA-F]{40}$"
                byte_size:
                  type: integer
                  minimum: 1
                  maximum: 134217728
                system:
                  type: string
                  enum:
                  - nes
                  - snes
                  - gb
                  - gbc
                  - megadrive
                  - pcengine
                  - atari2600
                  - c64
        required: true
  "/v1/validations/{sha1}/file.json":
    put:
      summary: Receive the admitted raw file into private storage
      description: 'Admission is accepted only in X-Validation-Admission. Fresh signed
        admissions expire in ten minutes and bind normalized SHA-1, size and system.
        Availability, media/encoding, Rack Content-Length presence/format/global bound,
        path, admission/persisted facts, known release and admitted length are checked
        before body reading, even for completed retries. Completed retries confirm
        without reading or rewriting the file. Incomplete uploads have a 120-second
        application read deadline, 64 KiB chunks and a 134,217,728-byte ceiling; after
        EOF, count precedes SHA-1. Transport rejection can fall outside this JSON
        contract: repeat POST to recover. No public file route or signed download
        link exists.'
      parameters:
      - name: sha1
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{40}$"
      - name: X-Validation-Admission
        in: header
        required: true
        schema:
          type: string
      - name: Content-Length
        in: header
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 134217728
      - name: Content-Encoding
        in: header
        required: false
        schema:
          type: string
          enum:
          - identity
      responses:
        '200':
          description: received, including a completed retry
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationReceived"
        '400':
          description: malformed path checksum or invalid Rack Content-Length
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_metadata
        '403':
          description: missing, invalid, expired or mismatched admission
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_admission
        '408':
          description: application body-read deadline exceeded
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - upload_timeout
        '409':
          description: file joined a release after admission, in any system or media
            position
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - known_release
        '411':
          description: Rack Content-Length absent
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - length_required
        '413':
          description: declared or actual body above the global ceiling
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - file_too_large
        '415':
          description: unsupported media type or content encoding
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - unsupported_media_type
        '422':
          description: admitted/actual size or actual SHA-1 mismatch
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - size_mismatch
                    - checksum_mismatch
        '503':
          description: receipt or private storage unavailable
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - unavailable
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        required: true
components:
  schemas:
    ValidationReceived:
      type: object
      required:
      - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - received
    Release:
      type: object
      required:
      - release
      - game
      - media
      - startup
      additionalProperties: false
      properties:
        release:
          type: object
          required:
          - id
          - sha1
          - system
          - region
          - revision
          additionalProperties: false
          properties:
            id:
              type: string
            sha1:
              type: string
              pattern: "^[0-9a-f]{40}$"
            system:
              type: string
              enum:
              - nes
              - snes
              - gb
              - gbc
              - megadrive
              - pcengine
              - atari2600
              - c64
            region:
              type: string
              nullable: true
            revision:
              type: string
              nullable: true
        game:
          type: object
          required:
          - id
          - title
          additionalProperties: false
          properties:
            id:
              type: string
            title:
              type: string
        media:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - key
            - position
            - label
            - role
            - sha1
            - size
            - format
            additionalProperties: false
            properties:
              key:
                type: string
                pattern: "^[a-z0-9-]{1,32}$"
              position:
                type: integer
                minimum: 1
              label:
                type: string
                nullable: true
                maxLength: 80
              role:
                type: string
                enum:
                - game
                - save
              sha1:
                type: string
                pattern: "^[0-9a-f]{40}$"
              size:
                type: integer
                minimum: 0
                nullable: true
              format:
                type: string
                pattern: "^[a-z0-9]+$"
                nullable: true
        startup:
          type: object
          required:
          - schema
          - boot
          - drives
          - revision
          additionalProperties: false
          properties:
            schema:
              type: integer
              enum:
              - 1
            boot:
              type: string
            drives:
              type: object
              additionalProperties: false
              properties:
                '8':
                  type: string
                '9':
                  type: string
            revision:
              type: string
              pattern: "^[0-9a-f]{64}$"
servers:
- url: "/"

          video/mp4:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: string
              format: binary
        required: true
  "/v1/releases/{sha1}.json":
    get:
      summary: A release and its game, by the SHA-1 of its game file
      description: 'The target of an unambiguous lookup redirect. Hex is case-insensitive;
        release.sha1 is the asked file and release.id identifies the whole release.
        Media are in position order. Startup applies defaults and includes a SHA-256
        revision over effective startup and ordered checksums. C64 slots are 8 and
        9; other systems have no drives. release.compatibility gives works, attention
        (with a reason), does_not_work or unknown for steam_machine and steam_deck
        separately: the newest recorded result under the current startup revision,
        with its core, core version, evidence and the input devices besides the controller
        it needs (requires_input), or unknown. The service never infers a set from
        one checksum or from file names. Successes are public for 300 seconds with
        ETag and Last-Modified validators; corrections refresh both, while cached
        responses may remain until their existing TTL expires. Current conditional
        requests return 304. Errors are never stored.'
      parameters:
      - name: sha1
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{40}$"
          minLength: 40
          maxLength: 40
      responses:
        '200':
          description: release and game
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - max-age=300, public
            ETag:
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Release"
        '400':
          description: malformed SHA-1
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_sha1
        '404':
          description: unknown SHA-1
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - release_not_found
        '409':
          description: file belongs to several releases; use /v1/media/{sha1}.json
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - ambiguous_release
  "/v1/screenshot-stages/{release_id}/{source_sha1}/{kind}.json":
    post:
      summary: Stage a private screenshot for MCP publication
      security:
      - private_service_basic: []
      parameters:
      - name: release_id
        in: path
        required: true
        schema:
          type: string
      - name: source_sha1
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{40}$"
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum:
          - title
          - gameplay
      description: |
        Raw PNG bytes, protected by shared single-admin HTTP Basic before parsing, logging or mutation; no capture token required. The stable release public ID, exact source-medium SHA-1 and kind are bound before decoding. Secondary and shared media are accepted only for the explicit containing release. Uses capture's 8 MiB input ceiling, system dimension ceilings, full PNG validation and pixel-only re-encoding.

        Returns only an opaque staging_id and expires_at, exactly 24 hours after successful ingest. Staging never changes public JSON, validators or PNG delivery and exposes no anonymous stage/read/redirect route. Missing or malformed public-base configuration or incomplete production R2 configuration disables ingest before PNG processing. All responses and the complete staging subtree are no-store and excluded from application logs; hosted proxy/CDN cache, access-log, body/header and tracing exclusions are required too.

        Call MCP publish_screenshot with staging_id and the same release_id, source_sha1 and kind. It rechecks membership, adopts the canonical blob without copying, uses the game image licence at publication and atomically consumes the ID. Before expiry a repeated successful-target call returns staged_image_consumed, even after replacement/removal; at expiry it returns staged_image_unavailable. Failed attempts leave the stage retryable and do not extend expiry. The hourly cleanup job processes bounded batches of expired stages/receipts and purges unconsumed blobs, never transferred screenshot blobs. Solid Queue workers and its recurring scheduler must run. No explicit discard API exists. Publication errors: invalid_input, not_found, target_mismatch, staged_image_unavailable, staged_image_consumed, uploads_disabled, storage_unavailable.
      responses:
        '201':
          description: private stage created
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - staging_id
                - expires_at
                properties:
                  staging_id:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '400':
          description: malformed target
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_input
        '401':
          description: missing or wrong shared credentials
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
        '404':
          description: unknown release public ID
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - not_found
        '409':
          description: checksum outside this release
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - target_mismatch
        '413':
          description: input exceeds 8 MiB
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - screenshot_too_large
        '422':
          description: invalid PNG, animation, content type or dimensions
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_screenshot
        '503':
          description: authentication, uploads or storage unavailable
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - authentication_unavailable
                    - uploads_disabled
                    - storage_unavailable
      requestBody:
        content:
          image/png:
            schema:
              type: string
              format: binary
        required: true
  "/v1/releases/{sha1}/screenshots/{kind}.json":
    put:
      summary: Publish a capture-device screenshot
      security:
      - capture_token: []
      parameters:
      - name: sha1
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{40}$"
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum:
          - title
          - gameplay
      description: |
        Raw image/png body, authenticated before decoding or storing. A secondary-disk checksum targets its containing release; shared checksums are ambiguous. Success replaces only this release/kind; failure preserves its previous image. The service copies game screenshot_licence, never a client-supplied licence. Upload grants no rights. All responses are no-store.

        Maximum input: 8 MiB (8,388,608 bytes). PNG only; malformed and animated PNGs are rejected. Dimensions are positive and checked before decoding, followed by full decoding and pixel-only PNG re-encoding. Fixed capture ceilings, independent of crop, overscan, borders or interlace:

        | System | Maximum width | Maximum height |
        | --- | ---: | ---: |
        | nes | 1024 | 960 |
        | snes | 2048 | 1912 |
        | gb | 640 | 576 |
        | gbc | 640 | 576 |
        | megadrive | 1280 | 1920 |
        | pcengine | 2048 | 960 |
        | atari2600 | 640 | 768 |
        | c64 | 1536 | 1088 |

        Unset/empty SCREENSHOT_CAPTURE_TOKEN or incomplete production R2/public-origin configuration disables uploads. URLs use the configured HTTPS origin, never request headers, R2 URLs or signed URLs.
      responses:
        '200':
          description: screenshot published
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Screenshot"
        '400':
          description: malformed SHA-1
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_sha1
        '401':
          description: missing or wrong capture token
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - unauthorized
        '404':
          description: unknown release
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - release_not_found
        '409':
          description: checksum shared by releases
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - ambiguous_release
        '413':
          description: input exceeds 8 MiB
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - screenshot_too_large
        '422':
          description: invalid kind, PNG, animation or dimensions
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_screenshot
        '503':
          description: uploads disabled or storage unavailable
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - uploads_disabled
                    - storage_unavailable
      requestBody:
        content:
          image/png:
            schema:
              type: string
              format: binary
        required: true
  "/v1/screenshots/{sha256}.png":
    get:
      summary: Read a published screenshot
      description: Anonymous Rails-origin PNG delivery. Content-addressed URLs cache
        publicly for 31,536,000 seconds. A missing or unreferenced image returns JSON
        with no-store. Origin removal cannot erase CDN or client cached copies.
      parameters:
      - name: sha256
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-f]{64}$"
      responses:
        '200':
          description: stored PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
          headers:
            Content-Type:
              schema:
                type: string
                enum:
                - image/png
            Cache-Control:
              schema:
                type: string
                enum:
                - max-age=31536000, public
        '404':
          description: missing or unreferenced image
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum:
                    - screenshot_not_found
components:
  securitySchemes:
    capture_token:
      type: http
      scheme: bearer
    private_service_basic:
      type: http
      scheme: basic
  schemas:
    playthrough_declaration:
      type: object
      additionalProperties: false
      required:
      - retry_key
      - release_id
      - source_sha1
      - capture
      - manifest
      properties:
        retry_key:
          type: string
          minLength: 1
          maxLength: 200
        release_id:
          type: string
          minLength: 1
          maxLength: 200
          description: Stable release public_id, never a title or checksum selector.
        source_sha1:
          type: string
          pattern: "^[0-9a-f]{40}$"
          minLength: 40
          maxLength: 40
        capture:
          type: object
          additionalProperties: false
          required:
          - tool
          - version
          - captured_at
          properties:
            tool:
              type: string
              minLength: 1
              maxLength: 200
            version:
              type: string
              minLength: 1
              maxLength: 200
            captured_at:
              type: string
              format: date-time
              maxLength: 64
        verification:
          type: object
          additionalProperties: false
          required:
          - source_sha1
          - payload_sha1
          - relationship
          - method
          - result
          - verifier
          - verified_at
          - evidence
          properties:
            source_sha1:
              type: string
              pattern: "^[0-9a-f]{40}$"
              minLength: 40
              maxLength: 40
            payload_sha1:
              type: string
              pattern: "^[0-9a-f]{40}$"
              minLength: 40
              maxLength: 40
            relationship:
              type: string
              enum:
              - trailing_padding
              - verified_equivalence
            removed_bytes:
              type: integer
              minimum: 1
            method:
              type: string
              minLength: 1
              maxLength: 8000
            result:
              type: string
              enum:
              - success
            verifier:
              type: string
              minLength: 1
              maxLength: 8000
            verified_at:
              type: string
              format: date-time
              maxLength: 64
            evidence:
              type: string
              minLength: 1
              maxLength: 8000
        manifest:
          type: array
          minItems: 1
          maxItems: 4096
          items:
            type: object
            additionalProperties: false
            required:
            - path
            - byte_size
            - sha256
            - content_type
            properties:
              path:
                type: string
                minLength: 1
                maxLength: 1024
              byte_size:
                type: integer
                minimum: 1
                maximum: 8388608
              sha256:
                type: string
                pattern: "^[0-9a-f]{64}$"
                minLength: 64
                maxLength: 64
              content_type:
                type: string
                minLength: 1
                maxLength: 200
    Screenshot:
      type: object
      required:
      - kind
      - url
      - width
      - height
      - licence
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - title
          - gameplay
        url:
          type: string
          format: uri
          pattern: "^https://"
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        licence:
          type: string
    ControllerProfile:
      type: object
      required:
      - version
      - layout
      - prompts
      additionalProperties: false
      description: Optional exact-release original SNES layout and literal gameplay
        prompt letters. Positions face the controller buttons. No system defaults
        or edition inference. Binding and text citations remain internal. Controller
        classification, physical label/symbol mapping and preferences belong to the
        launcher. The Zelda trial is unconfirmed pending owner confirmation of the
        stable release ID, checksum, edition and textual evidence; no real trial profile
        is populated.
      properties:
        version:
          type: integer
          enum:
          - 1
        layout:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            required:
            - position
            - label
            additionalProperties: false
            properties:
              position:
                type: string
                enum:
                - top
                - right
                - bottom
                - left
              label:
                type: string
                enum:
                - X
                - A
                - B
                - "Y"
        prompts:
          type: array
          maxItems: 16
          items:
            type: object
            required:
            - letter
            - position
            additionalProperties: false
            properties:
              letter:
                type: string
                pattern: "^[A-Za-z]$"
                minLength: 1
                maxLength: 1
              position:
                type: string
                enum:
                - top
                - right
                - bottom
                - left
    DeviceCompatibility:
      description: 'The newest result recorded for this device class under the release''s
        current startup.revision, or unknown when there is none. unknown carries only
        status and never stops a launch. works, attention (a recorded problem, such
        as performance, explained in one sentence) and does_not_work name the core
        and version tested, the launch configuration (startup_revision) and test time,
        with a short public reason sentence (required for attention, optional for
        does_not_work, null for works), what the reviewer saw (observed) and what
        the test did not cover (limits). requires_input lists input devices besides
        the controller (keyboard, mouse) that the release needs to be playable on
        this device class, empty when none; it is separate from status: the launcher
        shows attention while a listed device is not connected, and does_not_work
        outranks attention. No state blocks Play. Compare core and core_version with
        your own before treating a result as yours.'
      oneOf:
      - type: object
        required:
        - status
        additionalProperties: false
        properties:
          status:
            type: string
            enum:
            - unknown
      - type: object
        required:
        - status
        - reason
        - core
        - core_version
        - startup_revision
        - tested_at
        - observed
        - limits
        - requires_input
        additionalProperties: false
        properties:
          status:
            type: string
            enum:
            - works
            - attention
            - does_not_work
          reason:
            type: string
            nullable: true
            minLength: 1
            maxLength: 200
          core:
            type: string
            pattern: "^[a-z0-9][a-z0-9_.-]{0,63}$"
          core_version:
            type: string
            minLength: 1
            maxLength: 100
          startup_revision:
            type: string
            pattern: "^[0-9a-f]{64}$"
          tested_at:
            type: string
            format: date-time
          observed:
            type: string
            minLength: 1
            maxLength: 500
          limits:
            type: string
            minLength: 1
            maxLength: 500
          requires_input:
            type: array
            uniqueItems: true
            items:
              type: string
              enum:
              - keyboard
              - mouse
    Compatibility:
      type: object
      required:
      - steam_machine
      - steam_deck
      additionalProperties: false
      description: Playability per device class, recorded by a named reviewer who
        owns and played the exact file. A Steam Machine result says nothing about
        Steam Deck. Recording a result refreshes this release's and its media's validators.
      properties:
        steam_machine:
          "$ref": "#/components/schemas/DeviceCompatibility"
        steam_deck:
          "$ref": "#/components/schemas/DeviceCompatibility"
    Release:
      type: object
      required:
      - release
      - game
      - media
      - startup
      additionalProperties: false
      properties:
        release:
          type: object
          required:
          - id
          - sha1
          - system
          - region
          - revision
          - screenshots
          - compatibility
          additionalProperties: false
          properties:
            id:
              type: string
            sha1:
              type: string
              pattern: "^[0-9a-f]{40}$"
            system:
              type: string
              enum:
              - nes
              - snes
              - gb
              - gbc
              - megadrive
              - pcengine
              - atari2600
              - c64
            region:
              type: string
              nullable: true
            revision:
              type: string
              nullable: true
            controller_profile:
              "$ref": "#/components/schemas/ControllerProfile"
            screenshots:
              type: array
              items:
                "$ref": "#/components/schemas/Screenshot"
            compatibility:
              "$ref": "#/components/schemas/Compatibility"
        game:
          type: object
          required:
          - id
          - title
          - screenshot
          additionalProperties: false
          properties:
            id:
              type: string
            title:
              type: string
            screenshot:
              type: object
              required:
              - kind
              - url
              - width
              - height
              - licence
              additionalProperties: false
              properties:
                kind:
                  type: string
                  enum:
                  - title
                  - gameplay
                url:
                  type: string
                  format: uri
                  pattern: "^https://"
                width:
                  type: integer
                  minimum: 1
                height:
                  type: integer
                  minimum: 1
                licence:
                  type: string
              nullable: true
        media:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - key
            - position
            - label
            - role
            - sha1
            - size
            - format
            additionalProperties: false
            properties:
              key:
                type: string
                pattern: "^[a-z0-9-]{1,32}$"
              position:
                type: integer
                minimum: 1
              label:
                type: string
                nullable: true
                maxLength: 80
              role:
                type: string
                enum:
                - game
                - save
              sha1:
                type: string
                pattern: "^[0-9a-f]{40}$"
              size:
                type: integer
                minimum: 0
                nullable: true
              format:
                type: string
                pattern: "^[a-z0-9]+$"
                nullable: true
        startup:
          type: object
          required:
          - schema
          - boot
          - drives
          - revision
          additionalProperties: false
          properties:
            schema:
              type: integer
              enum:
              - 1
            boot:
              type: string
            drives:
              type: object
              additionalProperties: false
              properties:
                '8':
                  type: string
                '9':
                  type: string
            revision:
              type: string
              pattern: "^[0-9a-f]{64}$"
    playthrough_validation_result:
      type: object
      additionalProperties: false
      required:
      - staging_id
      - declaration_sha256
      - package_sha256
      - manifest
      - release_id
      - source_sha1
      - capture
      - verification
      - root
      - duration
      - video_codec
      - audio_codec
      - chapters_path
      - chapters
      properties:
        staging_id:
          type: string
        declaration_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        package_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        manifest:
          type: array
          minItems: 1
          maxItems: 4096
          items:
            type: object
            additionalProperties: false
            required:
            - path
            - byte_size
            - sha256
            - content_type
            properties:
              path:
                type: string
                minLength: 1
                maxLength: 1024
              byte_size:
                type: integer
                minimum: 1
                maximum: 8388608
              sha256:
                type: string
                pattern: "^[0-9a-f]{64}$"
                minLength: 64
                maxLength: 64
              content_type:
                type: string
                minLength: 1
                maxLength: 200
        release_id:
          type: string
          minLength: 1
          maxLength: 200
          description: Stable release public_id, never a title or checksum selector.
        source_sha1:
          type: string
          pattern: "^[0-9a-f]{40}$"
          minLength: 40
          maxLength: 40
        capture:
          type: object
          additionalProperties: false
          required:
          - tool
          - version
          - captured_at
          properties:
            tool:
              type: string
              minLength: 1
              maxLength: 200
            version:
              type: string
              minLength: 1
              maxLength: 200
            captured_at:
              type: string
              format: date-time
              maxLength: 64
        verification:
          type: object
          additionalProperties: false
          required:
          - source_sha1
          - payload_sha1
          - relationship
          - method
          - result
          - verifier
          - verified_at
          - evidence
          properties:
            source_sha1:
              type: string
              pattern: "^[0-9a-f]{40}$"
              minLength: 40
              maxLength: 40
            payload_sha1:
              type: string
              pattern: "^[0-9a-f]{40}$"
              minLength: 40
              maxLength: 40
            relationship:
              type: string
              enum:
              - trailing_padding
              - verified_equivalence
            removed_bytes:
              type: integer
              minimum: 1
            method:
              type: string
              minLength: 1
              maxLength: 8000
            result:
              type: string
              enum:
              - success
            verifier:
              type: string
              minLength: 1
              maxLength: 8000
            verified_at:
              type: string
              format: date-time
              maxLength: 64
            evidence:
              type: string
              minLength: 1
              maxLength: 8000
          nullable: true
        root:
          type: string
          enum:
          - index.m3u8
        duration:
          type: string
          pattern: "^[0-9]+\\.[0-9]+$"
          description: Exact summed EXTINF seconds as a decimal string.
        video_codec:
          type: string
          enum:
          - h264
        audio_codec:
          type: string
          nullable: true
          enum:
          - aac
          -
        chapters_path:
          type: string
          nullable: true
          enum:
          - chapters.vtt
          -
        chapters:
          type: array
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required:
            - start
            - end
            - title
            properties:
              start:
                type: string
                pattern: "^[0-9]{2}:[0-5][0-9]:[0-5][0-9]\\.[0-9]{3}$"
              end:
                type: string
                pattern: "^[0-9]{2}:[0-5][0-9]:[0-5][0-9]\\.[0-9]{3}$"
              title:
                type: string
                minLength: 1
servers:
- url: "/"
